spring.application.name=accountshield

# ===================== DATABASE (PostgreSQL) =====================
# Dəyərləri environment variable-lardan oxuyur.
# Variable təyin olunmayıbsa, ":" işarəsindən sonrakı default dəyər istifadə olunur.
# Parolun default dəyəri yoxdur: onu mütləq DB_PASSWORD environment variable-ı ilə verin.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/accountshield}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================== JPA / HIBERNATE =====================
# update   -> Entity-lərə əsasən cədvəlləri yaradır/yeniləyir (development üçün)
spring.jpa.hibernate.ddl-auto=update
# İcra olunan SQL-ləri konsolda göstərir (development üçün)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# HTTP request bitənə qədər DB session-un açıq qalmasının qarşısını alır (best practice)
spring.jpa.open-in-view=false

# ===================== JWT =====================
# Secret environment variable-dan oxunur və default dəyəri YOXDUR:
# JWT_SECRET təyin olunmasa tətbiq işə düşməyəcək.
# Base64 formatında olmalıdır: decode olunduqdan sonra ən azı 32 bayt (256 bit, HS256 tələbi).
# Yaratmaq üçün (PowerShell): 32 təsadüfi bayt -> [Convert]::ToBase64String(...) -> 44 simvol.
jwt.secret=${JWT_SECRET}
# Access token-in ömrü (saniyə). Default: 900 = 15 dəqiqə (B3: qısa ömür, yenisi refresh token ilə alınır).
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}

# ===================== PAGINATION =====================
# Admin istifadəçi siyahısı: size göndərilməsə 20, göndərilsə maksimum 100
# (məs. size=1000000 → 100). Böyük cavablarla serveri yükləməyin qarşısını alır.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# ===================== ADMIN SEED =====================
# Tətbiq başlayanda bazada heç bir ADMIN yoxdursa, bu məlumatlarla bir ADMIN yaradılır.
# ADMIN_EMAIL və ya ADMIN_PASSWORD təyin olunmayıbsa seed atlanır (loga xəbərdarlıq yazılır).
# Parol koda/git-ə yazılmır, yalnız environment variable kimi verilir (8-72 simvol).
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:Administrator}

# ===================== ACCOUNT LOCKOUT (B1) =====================
# Ardıcıl bu qədər səhv paroldan sonra hesab müvəqqəti kilidlənir.
app.security.lockout.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
# Kilidin müddəti (dəqiqə). Müddət bitəndə kilid avtomatik açılır.
app.security.lockout.duration-minutes=${LOGIN_LOCK_MINUTES:15}

# ===================== EMAIL VERIFICATION (B2) =====================
# Təsdiq token-inin etibarlılıq müddəti (saat).
app.security.verification.token-ttl-hours=${VERIFICATION_TOKEN_HOURS:24}

# ===================== REFRESH TOKEN (B3) =====================
# Refresh token-in ömrü (gün). ABSOLUTE: login anından hesablanır, rotation müddəti uzatmır —
# bu müddət bitəndə istifadəçi yenidən login olmalıdır.
app.security.refresh-token.ttl-days=${REFRESH_TOKEN_DAYS:7}
